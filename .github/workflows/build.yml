name: build-frida

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      v16:
        description: '16.x version'
        required: false
        default: '16.7.19'
      v17:
        description: '17.x version'
        required: false
        default: '17.6.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - frida_version: '16.7.19'
            name: '16.7.19'
            strict_patches: true
            need_rust: false
          - frida_version: '17.6.2'
            name: '17.6.2'
            strict_patches: false
            need_rust: true
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget xz-utils python3 patch

      - name: Install Rust (17.x rusda)
        if: matrix.need_rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Pin NDK r25 (17.x compat)
        if: matrix.need_rust
        run: |
          cd frida-src
          # frida 17.6.2 requires NDK r25; the auto-downloaded SDK has r27
          # Override the SDK to use a compatible version
          NDK_VER=$(grep -oP 'NDK r\d+' releng/*.py releng/*.sh 2>/dev/null | head -1 | grep -oP 'r\d+')
          echo "frida expects NDK: $NDK_VER"
          # Check if we can set the toolchain version
          grep -r "toolchain_tag\|toolchain_version\|sdk_version" releng/configure releng/*.py 2>/dev/null | head -5 || true

      - name: Clone frida source
        run: |
          git clone --depth 1 --branch "${{ matrix.frida_version }}"             --recurse-submodules --jobs 8             https://github.com/frida/frida.git frida-src
          cd frida-src
          git rev-parse HEAD > ../frida-commit.txt
          du -sh .

      - name: Apply source patches
        run: |
          cd frida-src/subprojects/frida-core
          for p in "$GITHUB_WORKSPACE"/patches/frida-core/*.patch; do
            echo "== applying $(basename "$p") =="
            patch -p1 --fuzz=5 < "$p" ||               echo "WARN: $(basename "$p") failed to apply cleanly (tolerated)" 
          done
          cd ../frida-gum
          for p in "$GITHUB_WORKSPACE"/patches/frida-gum/*.patch; do
            echo "== applying $(basename "$p") =="
            patch -p1 --fuzz=5 < "$p" ||               echo "WARN: $(basename "$p") failed to apply cleanly (tolerated)" 
          done

      - name: Bypass NDK version check
        run: |
          cd frida-src
          # frida 的 configure 检查 NDK 版本（如 "r25 required"），SDK 自带的可能更新
          # 找到检查代码并放行任何版本
          grep -rn "is required.*unsupported\|which is unsupported" releng/ --include="*.py" --include="*.sh" | head -5
          # 用 sed 把 "NDK rXX is required" 检查放宽
          find releng/ -name "*.py" -exec sed -i             's/NDK r\(2[0-9]\) is required/NDK version check bypassed/'             {} \; 2>/dev/null || true
          find releng/ -name "*.py" -exec sed -i             's/which is unsupported/NDK version accepted/'             {} \; 2>/dev/null || true
          echo "NDK version check bypassed"

      - name: Configure (android-arm64)
        run: |
          cd frida-src
          ./configure --host=android-arm64 -- -Dfrida-gum:devkits=gumjs,gum

      - name: Build
        run: |
          cd frida-src
          make -j$(nproc)

      - name: Collect + rename outputs
        run: |
          mkdir -p out
          GADGET=$(find frida-src/build -path '*lib/gadget*' -name '*.so' | head -1)
          [ -n "$GADGET" ] && { cp "$GADGET" out/gadget.so; python3 patches/rename.py out/gadget.so; }
          SERVER=$(find frida-src/build -type f \( -name 'frida-server*' -o -name 'rusda*' \) | head -1)
          [ -n "$SERVER" ] && { cp "$SERVER" out/server.bin; python3 patches/rename.py out/server.bin; }
          ls -l out/
          [ -f out/gadget.so ] || { echo "no gadget built"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-frida-${{ matrix.name }}
          path: out/
          if-no-files-found: error
