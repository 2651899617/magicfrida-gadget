name: build-nianchu-frida

on:
  push:
    branches: [main, fix/build-integrity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nianchu-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run offline regression gates
        run: |
          set -euo pipefail
          mkdir -p logs
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -I -m venv "$GITHUB_WORKSPACE/.checks-venv"
          "$GITHUB_WORKSPACE/.checks-venv/bin/python3" -I -m pip install 'lief==0.17.6'
          "$GITHUB_WORKSPACE/.checks-venv/bin/python3" -I -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee logs/regression.log
      - name: Keep regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nianchu-regression-${{ github.run_id }}
          path: logs/
          if-no-files-found: error

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '16.7.19'
            ndk_revision: '25.2.9519653'
          - version: '17.25.2'
            ndk_revision: '29.0.14206865'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      FRIDA_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Go for the Frida 17 compiler backend
        if: matrix.version == '17.25.2'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install host build dependencies
        run: |
          set -euo pipefail
          mkdir -p reports logs
          sudo apt-get update
          sudo apt-get install -y build-essential git curl xz-utils python3 python3-dev python3-venv patch unzip ninja-build pkg-config
      - name: Configure isolated ELF rewrite tooling
        run: |
          set -euo pipefail
          python3 -I -m venv "$GITHUB_WORKSPACE/.elf-venv"
          "$GITHUB_WORKSPACE/.elf-venv/bin/python3" -I -m pip install 'lief==0.17.6'
          printf '%s\n' "$GITHUB_WORKSPACE/.elf-venv/bin" >> "$GITHUB_PATH"
          printf '%s\n' "NIANCHU_ELF_REWRITER=$GITHUB_WORKSPACE/patches/rename.py" >> "$GITHUB_ENV"
          printf '%s\n' "NIANCHU_BRIDGE_PATCHER=$GITHUB_WORKSPACE/scripts/patch_reference_bridge.py" >> "$GITHUB_ENV"
      - name: Configure JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install exact upstream NDK revision
        run: |
          set -euo pipefail
          sdkmanager "ndk;${{ matrix.ndk_revision }}" 2>&1 | tee logs/ndk.log
          printf 'ANDROID_NDK_ROOT=%s/ndk/%s\n' "$ANDROID_HOME" '${{ matrix.ndk_revision }}' >> "$GITHUB_ENV"
      - name: Clone pinned upstream source and initialize submodules
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRIDA_VERSION" --recurse-submodules --jobs 4 \
            https://github.com/frida/frida.git frida-src 2>&1 | tee logs/source.log
          git -C frida-src submodule update --init --recursive --jobs 4 2>&1 | tee -a logs/source.log
      - name: Verify actual source commits and toolchain
        run: |
          set -euo pipefail
          python3 -I scripts/verify_source.py --source frida-src --version "$FRIDA_VERSION" \
            --ndk "$ANDROID_NDK_ROOT" --report reports/source.json 2>&1 | tee logs/verify-source.log
      - name: Apply compatible source profile strictly
        run: |
          set -euo pipefail
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --dry-run --report reports/compatible-dry-run.json 2>&1 | tee logs/compatible-patches.log
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --report reports/compatible.json 2>&1 | tee -a logs/compatible-patches.log
      - name: Configure Android arm64 server and Gadget
        working-directory: frida-src
        run: |
          set -euo pipefail
          extra=()
          if [ "$FRIDA_VERSION" = '17.25.2' ]; then
            go version | tee ../logs/go-version.log
            extra+=(-Dfrida-core:compiler_backend=enabled)
          fi
          ./configure --host=android-arm64 -- \
            -Dserver=enabled -Dgadget=enabled \
            -Dfrida_tools=disabled -Dgraft_tool=disabled -Dportal=disabled \
            -Dinject=disabled -Dfrida_python=disabled \
            -Dfrida_node=disabled -Dfrida_swift=disabled -Dfrida_qml=disabled \
            -Dfrida-core:tests=disabled -Dfrida-gum:tests=disabled \
            -Dfrida-core:assets=embedded "${extra[@]}" \
            2>&1 | tee ../logs/configure.log
      - name: Build nianchu server and modified auto-init Gadget
        working-directory: frida-src
        run: |
          set -euo pipefail
          make -j2 2>&1 | tee ../logs/compatible-build.log
      - name: Verify compatible source and collect both final targets
        run: |
          set -euo pipefail
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --report reports/compatible-post-build.json 2>&1 | tee logs/compatible-post-build.log
          python3 -I scripts/collect_artifacts.py --rewrite-elf --build frida-src/build --version "$FRIDA_VERSION" \
            --out out/compatible --source-report reports/source.json \
            --patch-report reports/compatible-post-build.json 2>&1 | tee logs/compatible-collect.log
      - name: Add explicit Zygisk initialization source feature
        run: |
          set -euo pipefail
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --feature zygisk-loader --dry-run --report reports/zygisk-dry-run.json 2>&1 | tee logs/zygisk-patches.log
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --feature zygisk-loader --report reports/zygisk.json 2>&1 | tee -a logs/zygisk-patches.log
      - name: Build module-specific Gadget incrementally
        working-directory: frida-src
        run: |
          set -euo pipefail
          make -j2 2>&1 | tee ../logs/zygisk-build.log
      - name: Verify and collect module-specific final targets
        run: |
          set -euo pipefail
          python3 -I scripts/apply_patches.py --source frida-src --version "$FRIDA_VERSION" \
            --feature zygisk-loader --report reports/zygisk-post-build.json 2>&1 | tee logs/zygisk-post-build.log
          python3 -I scripts/collect_artifacts.py --rewrite-elf --build frida-src/build --version "$FRIDA_VERSION" \
            --out out/zygisk --source-report reports/source.json \
            --patch-report reports/zygisk-post-build.json 2>&1 | tee logs/zygisk-collect.log
      - name: Build wrapper and package verified final Gadget
        run: |
          set -euo pipefail
          python3 -I scripts/build_module.py --ndk "$ANDROID_NDK_ROOT" \
            --out out/module --manifest out/zygisk/manifest.json 2>&1 | tee logs/module-build.log
      - name: Publish verified build artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: nianchu-frida-${{ matrix.version }}-android-arm64
          path: |
            out/compatible/
            out/zygisk/
            out/module/nianchu-zygisk-*.zip
            out/module/build-report.json
            NOTICE/
          if-no-files-found: error
      - name: Keep provenance and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nianchu-build-logs-${{ matrix.version }}-${{ github.run_id }}
          path: |
            logs/
            reports/
            frida-src/build/meson-logs/
            frida-src/build/meson-info/intro-targets.json
          if-no-files-found: warn
